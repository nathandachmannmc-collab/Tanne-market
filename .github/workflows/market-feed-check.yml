name: One-time public market feed check

on:
  push:
    paths:
      - ".github/workflows/market-feed-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public page and public script references with normal browser headers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pages = [
            'https://hugosmp-market.net/live',
            'https://www.friendswithmoney.net/marketplace'
          ];
          const out = [];
          const seen = new Set();
          const endpoints = new Set();
          const signal = new Set();
          const UA = 'Mozilla/5.0 (iPad; CPU OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';

          async function get(url) {
            try {
              const r = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(10000),
                headers: {
                  'User-Agent': UA,
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'de-DE,de;q=0.9,en;q=0.8',
                  'Cache-Control': 'no-cache'
                }
              });
              const body = await r.text();
              out.push('FETCH ' + r.status + ' ' + r.url + ' bytes=' + body.length);
              return {status:r.status,url:r.url,body};
            } catch(e) {
              out.push('FETCH ERROR ' + url + ' ' + String(e).slice(0,150));
              return null;
            }
          }

          function scan(body, label) {
            for(const m of body.matchAll(/(?:https?:\/\/|wss?:\/\/)[^\s"'<>\\)]+/g)) {
              const v=m[0].slice(0,180);
              if(/api|socket|live|market|supabase|pusher|ably|graphql|firebase/i.test(v)) endpoints.add(label+' :: '+v);
            }
            for(const m of body.matchAll(/(?:\/api\/|WebSocket|EventSource|socket\.io|supabase|pusher|ably|graphql|trpc|createClient)/ig)) {
              const s=Math.max(0,m.index-75), e=Math.min(body.length,m.index+m[0].length+130);
              signal.add(label+' :: '+body.slice(s,e).replace(/\s+/g,' ').slice(0,230));
            }
          }

          (async()=>{
            for(const page of pages){
              out.push('\n=== PAGE '+page+' ===');
              const p=await get(page);
              if(!p) continue;
              if(p.status===403){
                out.push('ACCESS_DENIED: stop here; no retry or access-control workaround will be attempted.');
                continue;
              }
              if(p.status>=400) continue;
              scan(p.body,page);
              const refs=[];
              for(const m of p.body.matchAll(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>/ig)){
                try{refs.push(new URL(m[1],p.url).href)}catch{}
              }
              for(const src of [...new Set(refs)].slice(0,35)){
                if(seen.has(src)) continue;
                seen.add(src);
                const js=await get(src);
                if(js&&js.status<400&&js.body.length<3500000) scan(js.body,src);
                if(js&&js.status===403) out.push('SCRIPT_ACCESS_DENIED: no further attempts will be made for this source.');
              }
            }
            out.push('\n=== PUBLIC ENDPOINT CANDIDATES ===');
            out.push(...[...endpoints].sort().slice(0,120));
            out.push('\n=== CLIENT FEED CODE HINTS ===');
            out.push(...[...signal].sort().slice(0,100));
            fs.writeFileSync('market-feed-check.txt',out.join('\n'));
            console.log(out.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Store short diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: market-feed-check
          path: market-feed-check.txt
          if-no-files-found: warn
          retention-days: 1
