name: Temporary public market endpoint probe

on:
  push:
    paths:
      - ".github/workflows/probe-market-endpoints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public frontend assets for documented client endpoints
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pages = [
            'https://hugosmp-market.net/live',
            'https://www.friendswithmoney.net/marketplace'
          ];
          const report = [];
          const apiPattern = /\/api\/[A-Za-z0-9_./?=&%:{}-]{2,}/g;
          const socketPattern = /(?:wss?|https?):\/\/[^\s"'<>\\)]+/g;
          const signalPattern = /WebSocket|EventSource|socket\.io|supabase|pusher|ably|graphql|createClient|connect\(/ig;
          const seenScripts = new Set();
          const candidates = new Set();
          const sockets = new Set();
          const signals = new Set();

          async function get(url) {
            try {
              const r = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(12000),
                headers: { 'User-Agent': 'TanneMarket-public-endpoint-check/1.0', 'Accept': '*/*' }
              });
              const text = await r.text();
              report.push('FETCH ' + r.status + ' ' + r.url + ' bytes=' + text.length);
              return {status:r.status, url:r.url, text};
            } catch (e) {
              report.push('FETCH ERROR ' + url + ' :: ' + String(e).slice(0,180));
              return null;
            }
          }

          function scan(text, label) {
            for (const m of text.matchAll(apiPattern)) candidates.add(label + ' :: ' + m[0].slice(0,220));
            for (const m of text.matchAll(socketPattern)) {
              const v = m[0].slice(0,220);
              if (/api|ws|socket|live|market|supabase|pusher|ably|graphql/i.test(v)) sockets.add(label + ' :: ' + v);
            }
            for (const m of text.matchAll(signalPattern)) {
              const left = Math.max(0, m.index - 70), right = Math.min(text.length, m.index + m[0].length + 120);
              signals.add(label + ' :: ' + text.slice(left,right).replace(/\s+/g,' ').slice(0,230));
            }
          }

          (async () => {
            for (const page of pages) {
              report.push('\n=== PAGE ' + page + ' ===');
              const result = await get(page);
              if (!result || result.status >= 400) continue;
              scan(result.text, page);
              const refs = [];
              const re = /<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>/ig;
              for (const m of result.text.matchAll(re)) {
                try { refs.push(new URL(m[1], result.url).href); } catch {}
              }
              const unique = [...new Set(refs)].slice(0,70);
              report.push('SCRIPT_COUNT ' + unique.length);
              for (const src of unique) {
                if (seenScripts.has(src)) continue;
                seenScripts.add(src);
                const js = await get(src);
                if (js && js.status < 400 && js.text.length < 5_000_000) scan(js.text, src);
              }
            }
            report.push('\n=== POSSIBLE API PATHS (' + candidates.size + ') ===');
            report.push(...[...candidates].sort().slice(0,180));
            report.push('\n=== POSSIBLE LIVE/EXTERNAL ENDPOINTS (' + sockets.size + ') ===');
            report.push(...[...sockets].sort().slice(0,180));
            report.push('\n=== CONNECTION CODE HINTS (' + signals.size + ') ===');
            report.push(...[...signals].sort().slice(0,100));
            fs.writeFileSync('market-endpoint-probe.txt', report.join('\n'));
            console.log(report.join('\n'));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: market-endpoint-probe
          path: market-endpoint-probe.txt
          if-no-files-found: warn
          retention-days: 1
